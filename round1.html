<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coralverse - Round 1</title>
    <style>
        body {
            background-color: #0b132b;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: #1c2541;
            border: 2px solid #6fffe9;
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 0 20px rgba(111, 255, 233, 0.2);
        }

        h1 {
            color: #6fffe9;
            text-align: center;
            margin-bottom: 10px;
        }

        .question-card {
            margin-bottom: 25px;
        }

        .question-text {
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background-color: #3a506b;
            color: #ffffff;
            border: 1px solid #5bc0be;
            padding: 12px 15px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            opacity: 0.9;
        }

        /* 4 Distinct Option Selection Colors */
        .option-btn.btn-a.selected { background-color: #ff5722 !important; color: #fff; font-weight: bold; } /* Orange */
        .option-btn.btn-b.selected { background-color: #4caf50 !important; color: #fff; font-weight: bold; } /* Green */
        .option-btn.btn-c.selected { background-color: #2196f3 !important; color: #fff; font-weight: bold; } /* Blue */
        .option-btn.btn-d.selected { background-color: #9c27b0 !important; color: #fff; font-weight: bold; } /* Purple */

        .submit-btn {
            width: 100%;
            background-color: #6fffe9;
            color: #0b132b;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s ease;
        }

        .submit-btn:hover {
            background-color: #5bc0be;
        }

        .already-submitted {
            text-align: center;
            padding: 40px 20px;
        }

        .already-submitted h2 {
            color: #ff5722;
        }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <h1>CORALVERSE: ROUND 1</h1>
    
    <form id="quiz-form" onsubmit="handleFormSubmit(event)">
        <div class="question-card">
            <p class="question-text"><strong>Q1.</strong> Which organelle is known as the powerhouse of the cell for generating ATP energy?</p>
            <div class="options-grid">
                <button type="button" class="option-btn" onclick="selectOption(this, 'A')">A) Nucleus</button>
                <button type="button" class="option-btn" onclick="selectOption(this, 'B')">B) Mitochondrion</button>
                <button type="button" class="option-btn" onclick="selectOption(this, 'C')">C) Ribosome</button>
                <button type="button" class="option-btn" onclick="selectOption(this, 'D')">D) Endoplasmic Reticulum</button>
            </div>
        </div>

        <button type="submit" id="submit-btn" class="submit-btn">SUBMIT ROUND 1</button>
    </form>
</div>

<script>
    // 1. Prevent Re-submission or Re-playing on Refresh
    document.addEventListener("DOMContentLoaded", () => {
        if (localStorage.getItem("coralverse_round1_completed") === "true") {
            showCompletedState();
        }
    });

    // 2. Dynamic 4-Color Selection Logic
    function selectOption(btn, optionLetter) {
        const siblings = btn.parentElement.querySelectorAll('.option-btn');
        siblings.forEach(b => b.classList.remove('selected', 'btn-a', 'btn-b', 'btn-c', 'btn-d'));

        btn.classList.add('selected', `btn-${optionLetter.toLowerCase()}`);
    }

    // 3. Handle Form Submission
    function handleFormSubmit(e) {
        e.preventDefault();

        // Check if an option was selected
        const selected = document.querySelector('.option-btn.selected');
        if (!selected) {
            alert("Please select an answer before submitting!");
            return;
        }

        // Save completion flag locally
        localStorage.setItem("coralverse_round1_completed", "true");

        // Display completion view
        showCompletedState();
    }

    function showCompletedState() {
        document.getElementById("main-container").innerHTML = `
            <div class="already-submitted">
                <h2>ROUND 1 COMPLETED!</h2>
                <p>Your responses for Round 1 have been recorded.</p>
                <p>Please wait for the host to present the Round 2 QR Code on screen.</p>
            </div>
        `;
    }
</script>

</body>
</html>
